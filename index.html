<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8b0000" />
  <meta name="description" content="Tham quan thực tế ảo 360° Di tích Quốc gia Đặc biệt Đồng Khởi Bến Tre." />
  <meta property="og:title" content="Di tích Quốc gia Đặc biệt Đồng Khởi Bến Tre" />
  <meta property="og:description" content="Trải nghiệm thực tế ảo 360°." />
  <meta property="og:type" content="website" />
  <title>Di tích Quốc gia Đặc biệt Đồng Khởi Bến Tre</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />

  <style>
    :root {
      --state-red: #8b0000;
      --state-red-dark: #650000;
      --state-gold: #f4d03f;
      --state-gold-soft: #ffe89a;
      --text: #ffffff;
      --header-h: 76px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #000;
      font-family: Arial, "Helvetica Neue", sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: grid;
      grid-template-rows: var(--header-h) 1fr;
      background: #000;
    }

    .official-header {
      position: relative;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: 8px 22px 9px;
      text-align: center;
      background:
        linear-gradient(180deg, rgba(255,255,255,.035), transparent 46%),
        linear-gradient(180deg, var(--state-red), var(--state-red-dark));
      border-bottom: 3px solid var(--state-gold);
      box-shadow: 0 3px 14px rgba(0,0,0,.35);
    }

    .official-header::before,
    .official-header::after {
      content: "";
      position: absolute;
      bottom: -3px;
      width: 18%;
      max-width: 220px;
      height: 3px;
      background: rgba(255,255,255,.2);
    }

    .official-header::before {
      left: 0;
    }

    .official-header::after {
      right: 0;
    }

    .official-title {
      min-width: 0;
    }

    .official-title h1 {
      margin: 0;
      color: var(--state-gold);
      font-family: Arial, "Helvetica Neue", sans-serif;
      font-size: clamp(15px, 2vw, 21px);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: .025em;
      text-transform: uppercase;
      text-shadow: 0 1px 1px rgba(0,0,0,.3);
    }

    .official-title p {
      margin: 4px 0 0;
      color: #fff;
      font-size: clamp(10px, 1.25vw, 13px);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .viewer-wrap {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: #000;
    }

    #vrFrame {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: #000;
    }

    .loading,
    .fallback {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: #f4f4f4;
      color: #2c2c2c;
      transition: opacity .3s ease, visibility .3s ease;
    }

    .loading.hidden,
    .fallback.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card,
    .fallback-card {
      width: min(88vw, 420px);
      padding: 28px 24px;
      text-align: center;
    }

    .emblem {
      width: 46px;
      height: 46px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--state-red);
      color: var(--state-gold);
      font-size: 22px;
      font-weight: 700;
      box-shadow: 0 0 0 4px rgba(139,0,0,.08);
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 18px;
      border: 3px solid #ddd;
      border-top-color: var(--state-red);
      border-radius: 50%;
      animation: spin .85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-card h2,
    .fallback-card h2 {
      margin: 0;
      color: var(--state-red-dark);
      font-size: 18px;
      line-height: 1.45;
      text-transform: uppercase;
    }

    .loading-card p,
    .fallback-card p {
      margin: 9px auto 0;
      max-width: 360px;
      color: #555;
      font-size: 13px;
      line-height: 1.65;
    }

    @media (max-width: 680px) {
      :root {
        --header-h: 68px;
      }

      .official-header {
        padding: 7px 12px 8px;
      }

      .official-title h1 {
        font-size: 14px;
        letter-spacing: .015em;
      }

      .official-title p {
        margin-top: 3px;
        font-size: 10px;
      }
    }

    @media (max-width: 420px) {
      :root {
        --header-h: 64px;
      }

      .official-title h1 {
        font-size: 12.5px;
      }

      .official-title p {
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="official-header" role="banner">
      <div class="official-title">
        <h1>🏛️ Di tích Quốc gia Đặc biệt Đồng Khởi Bến Tre</h1>
        <p>Trải nghiệm thực tế ảo 360°</p>
      </div>
    </header>

    <main class="viewer-wrap">
      <iframe
        id="vrFrame"
        title="Di tích Quốc gia Đặc biệt Đồng Khởi Bến Tre - Thực tế ảo 360°"
        src="https://vr360.com.vn/projects/di-tich-quoc-gia-dac-biet-dong-khoi-ben-tre/"
        allow="autoplay; fullscreen; xr-spatial-tracking; gyroscope; accelerometer; magnetometer"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>

      <div class="loading" id="loading" aria-live="polite">
        <div class="loading-card">
          <div class="spinner" aria-hidden="true"></div>
          <h2>Đang tải không gian tham quan 360°</h2>
          <p>Vui lòng giữ kết nối Internet trong quá trình tải nội dung.</p>
        </div>
      </div>

      <div class="fallback hidden" id="fallback" aria-live="polite">
        <div class="fallback-card">
          <div class="emblem" aria-hidden="true">★</div>
          <h2>Chưa thể tải không gian tham quan</h2>
          <p>Vui lòng kiểm tra kết nối Internet và tải lại trang.</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    (() => {
      const frame = document.getElementById('vrFrame');
      const loading = document.getElementById('loading');
      const fallback = document.getElementById('fallback');
      let loadTimer;

      function hideLoading() {
        loading.classList.add('hidden');
      }

      function showFallback() {
        loading.classList.add('hidden');
        fallback.classList.remove('hidden');
      }

      function armTimeout() {
        clearTimeout(loadTimer);
        loadTimer = setTimeout(() => {
          if (!navigator.onLine) showFallback();
          else hideLoading();
        }, 12000);
      }

      frame.addEventListener('load', () => {
        clearTimeout(loadTimer);
        setTimeout(hideLoading, 300);
      });

      window.addEventListener('offline', showFallback);
      window.addEventListener('online', () => {
        fallback.classList.add('hidden');
      });

      armTimeout();

      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
